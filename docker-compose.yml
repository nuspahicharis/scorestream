services:
  postgres:
    image: postgres:16
    container_name: betting-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-betting}
      POSTGRES_USER: ${DB_USER:-betting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-betting}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betting -d betting"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: